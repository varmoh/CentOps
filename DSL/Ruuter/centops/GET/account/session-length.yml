declaration:
  call: declare
  version: 0.1
  description: "Decription placeholder for 'SESSION-LENGTH'"
  method: get
  accepts: json
  returns: json
  namespace: centops

get_session_length:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/get-configuration"
    body:
      key: "session_length"
  result: res

return_result:
  return: ${res.response.body[0]?.value}
  status: 200