declaration:
  call: declare
  version: 0.1
  description: "Get status connection to cluster"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clusterName
        type: string
        description: "The name of the Kubernetes cluster"

check_for_required_parameters:
  switch:
    - condition: ${incoming.params.clusterName == null}
      next: return_incorrect_request
  next: extract_request_data

extract_request_data:
  assign:
    clusterName: ${incoming.params.clusterName}
  next: query_cluster_status

query_cluster_status:
  call: http.get
  args:
    url: "[#ARGO_CD_SERVER]/api/v1/clusters"
    headers:
      Authorization: "Bearer [#ARGO_CD_TOKEN]"
      Content-Type: application/json
  result: clusters_result
  #next: check_response

log_connection_state:
  log: ${clusters_result.response.body.items[0].connectionState.status}

check_response:
  switch:
    - condition: ${clusters_result.response.statusCodeValue >= 200 && clusters_result.response.statusCodeValue < 300}
      next: parse_cluster_status
  next: return_failed_status

parse_cluster_status:
  assign:
    matched_cluster: ${clusters_result.response.body.items.find(obj => obj.name === clusterName)}
  next: check_matched_cluster

check_matched_cluster:
  switch:
    # If cluster doesn't exist or connectionState is missing
    - condition: ${matched_cluster == null || matched_cluster.connectionState == null}
      next: return_failed_status
  # If cluster exists and has connectionState
  next: return_success

return_success:
  status: 200
  return: ${matched_cluster.connectionState.status}
  next: end

return_failed_status:
  status: 400
  return: "Connection status failed or cluster doesn't exist"
  next: end


