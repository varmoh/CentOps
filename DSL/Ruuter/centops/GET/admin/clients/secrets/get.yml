declaration:
  call: declare
  version: 0.1
  description: "Get a secret from Vault by path"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: string
        description: "Unique client id"
      - field: id
        type: number
        description: "Unique secret id"
    headers:
      - field: User-Agent
        type: string
        description: "User agent of the client"
      - field: cookie
        type: string
        description: "Cookie field"

validate_request_param:
  switch:
    - condition: ${incoming.params.clientId == null || incoming.params.id == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: get_user_info

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext:
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_parameters
  next: return_incorrect_request

assign_parameters:
  assign:
    client_id: ${incoming.params.clientId}
    secret_id: ${incoming.params.id}
    user_id: ${res.response.body.idCode}
    first_name: ${res.response.body.firstName}
    last_name: ${res.response.body.lastName}
    user_agent: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'user-agent')] || 'unknown'}
    ip_address: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-forwarded-for')] || 'unknown'}
  next: get_client_data

get_client_data:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-by-id"
    query:
      client_id: ${client_id}
  result: client_result
  next: check_client_data

check_client_data:
  switch:
    - condition: ${client_result.response.body[0] == null || client_result.response.body[0].kubernetesClusterNamespace == null}
      next: create_error_log
  next: extract_client_data

extract_client_data:
  assign:
    namespace: ${client_result.response.body[0].kubernetesClusterNamespace}
  next: get_client_secrets

get_client_secrets:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-secret-by-id"
    query:
      id: ${secret_id}
      client_id: ${client_id}
  result: secret_result
  next: check_secret_data

check_secret_data:
  switch:
    - condition: ${secret_result.response.body[0].environment == null || secret_result.response.body[0].name == null }
      next: create_error_log
  next: extract_secret_data

extract_secret_data:
  assign:
    name: ${secret_result.response.body[0].name}
    environment: ${secret_result.response.body[0].environment}
  next: get_vault_data_request

get_vault_data_request:
  call: http.get
  args:
    url: "[#VAULT_ADDR]/v1/[#VAULT_BASE_PATH]/${namespace}/${environment}/${name}"
    headers:
      X-Vault-Token: "[#VAULT_TOKEN]"
    error: create_error_log
  result: vault_result
  next: create_success_log

create_success_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/log-vault-api-get-delete-success-action"
    body:
      client_id: ${client_id}
      first_name: ${first_name}
      last_name: ${last_name}
      user_id_code: ${user_id}
      ip_address: ${ip_address}
      action: "GET"
      secret_key: "/[#VAULT_BASE_PATH]/${namespace}/${environment}/${name}"
      user_agent: ${user_agent}
      status_code: ${vault_result.response.statusCodeValue}
  result: log_result
  next: check_log_result

check_log_result:
  switch:
    - condition: ${log_result == null || log_result.response == null}
      next: create_error_log
  next: merge_json_objects

merge_json_objects:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER]/merge/objects"
    body:
      object1:
        data: ${vault_result.response.body.data.data}
      object2: ${secret_result.response.body[0]}
  result: merge_json_result
  next: return_success

return_success:
  return: ${merge_json_result.response.body}
  next: end

create_error_log:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/log-vault-api-get-delete-error-action"
    body:
      user_id_code: ${user_id}
      ip_address: ${ip_address}
      action: "POST"
      secret_key: ${path}
      user_agent: ${user_agent}
      status_code: ${status_code}
      error_message: ${error_message}
      client_id: ${client_id}
      first_name: ${first_name}
      last_name: ${last_name}
  next: return_incorrect_request

return_incorrect_request:
  status: 400
  return: "Incorrect request"
  next: end

return_bad_request:
  status: 400
  return: "clientId, id and cookie are required"
  next: end

return_not_found:
  status: 404
  return: "Secret not found"
  next: end
