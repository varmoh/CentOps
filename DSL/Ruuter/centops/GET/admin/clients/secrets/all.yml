declaration:
  call: declare
  version: 0.1
  description: "Get all secret list per client"
  method: get
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    params:
      - field: clientId
        type: string
        description: "Unique client id"
      - field: page
        type: number
      - field: pageSize
        type: number

validate_request_param:
  switch:
    - condition: ${incoming.params.clientId == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_incorrect_request
  next: get_user_info

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext:
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_parameters
  next: return_incorrect_request

assign_parameters:
  assign:
    client_id: ${incoming.params.clientId}
    page: ${incoming.params.page ?? 1}
    page_size: ${incoming.params.pageSize ?? 10}
    user_id: ${res.response.body.idCode}
    first_name: ${res.response.body.firstName}
    last_name: ${res.response.body.lastName}
  ext: send_request

send_request:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-secrets"
    query:
      client_id: ${client_id}
      page: ${page}
      page_size: ${page_size}
  result: secrets_result
  next: transform

transform:
  call: http.post
  args:
    url: "[#CENTOPS_DMAPPER_HBS]/transform-secrets"
    headers:
      type: "json"
    body:
      entries: ${secrets_result.response.body}
      page: ${page}
      pageSize: ${page_size}
  result: secrets
  next: return_secrets

return_secrets:
  return: ${secrets.response.body}
  next: end

return_incorrect_request:
  status: 400
  return: "clientId and cookie are required"
  next: end
