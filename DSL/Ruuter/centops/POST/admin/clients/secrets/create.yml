declaration:
  call: declare
  version: 0.1
  description: "Create a new secret in Vault"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: clientId
        type: string
        description: "Unique client id"
      - field: environment
        type: string
        description: "Environment type of deploying"
      - field: name
        type: string
        description: "Name of secrets"
      - field: data
        type: object
        description: "Secret data to store"
    headers:
      - field: User-Agent
        type: string
        description: "User agent of the client"
      - field: cookie
        type: string
        description: "Cookie field"

get_user_info:
  call: http.post
  args:
    url: "[#CENTOPS_TIM]/jwt/custom-jwt-userinfo"
    contentType: plaintext
    headers:
      cookie: ${incoming.headers.cookie}
    plaintext:
      "customJwtCookie"
  result: res
  next: check_user_info_response

check_user_info_response:
  switch:
    - condition: ${200 <= res.response.statusCodeValue && res.response.statusCodeValue < 300}
      next: assign_id_code
  next: return_incorrect_request

assign_id_code:
  assign:
    user_id: ${res.response.body.idCode}

check_for_required_parameters:
  switch:
    - condition: ${incoming.body.clientId == null || incoming.body.data == null || incoming.body.environment == null || incoming.body.name == null}
      next: create_error_log
  next: extract_request_data

extract_request_data:
  assign:
    clientId: ${incoming.body.clientId}
    environment: ${incoming.body.environment}
    name: ${incoming.body.name}
    data: ${incoming.body.data}
    user_agent: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'user-agent')] || 'unknown'}
    ip_address: ${incoming.headers[Object.keys(incoming.headers).find(h => h.toLowerCase() === 'x-forwarded-for')] || 'unknown'}
  next: get_client_data

get_client_data:
  call: http.get
  args:
    url: "[#CENTOPS_RESQL]/get-client-by-id"
    query:
      client_id: ${clientId}
  result: client_result
  next: check_client_data

check_client_data:
  switch:
    - condition: ${client_result.response.body[0].kubernetesClusterNamespace == null }
      next: create_error_log
  next: extract_client_data

extract_client_data:
  assign:
    namespace: ${client_result.response.body[0].kubernetesClusterNamespace}
  next: save_secret_into_vault

save_secret_into_vault:
  call: http.post
  args:
    url: "[#VAULT_ADDR]/v1/[#VAULT_BASE_PATH]/${namespace}/${environment}/${name}"
    headers:
      X-Vault-Token: "[#VAULT_TOKEN]"
      Content-Type: application/json
    body:
      data: ${data}
  result: vault_result
  error: create_error_log
  next: save_client_secret

#Store secret metadata into DB
save_client_secret:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-secret"
    body:
      client_id: ${clientId}
      name: ${name}
      environment: ${environment}
  result: secrets_write_result
  next: check_secrets_write_result

check_secrets_write_result:
  switch:
    - condition: ${secrets_write_result.response.body[0].id == null }
      next: create_error_log
  next: create_log_entry

create_log_entry:
  switch:
    - condition: ${200 <= vault_result.response.statusCodeValue && vault_result.response.statusCodeValue < 300}
      next: create_success_log
  next: create_error_log

create_success_log:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/log-vault-api-post-success-action"
    body:
      user_id_code: ${user_id}
      ip_address: ${ip_address}
      action: "POST"
      secret_key: "/[#VAULT_BASE_PATH]/${namespace}/${environment}/${name}"
      user_agent: ${user_agent}
      status_code: ${vault_result.response.statusCodeValue}
  result: log_result
  next: return_success

return_success:
  wrapper: false
  status: 201
  return: "Secret created successfully"
  next: end

create_error_log:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/log-vault-api-post-error-action"
    body:
      client_id: ${user_id}
      ip_address: ${ip_address}
      action: "POST"
      secret_key: ${path}
      user_agent: ${user_agent}
      status_code: ${status_code}
      error_message: ${error_message}
  next: return_vault_error

return_vault_error:
  assign:
    has_response: ${vault_result != null && vault_result.response != null}
    has_body: ${has_response && vault_result.response.body != null}
    status_code: "${has_response ? vault_result.response.statusCodeValue : 500}"
    error_message: "${has_body ? vault_result.response.body.errors : ['Internal server error']}"
  status: ${status_code}
  return: ${error_message}
  next: end

return_incorrect_request:
  status: 400
  return: "Incorrect request"
  next: end
