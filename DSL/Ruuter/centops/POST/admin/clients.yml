declaration:
  call: declare
  version: 0.1
  description: "Create a new client"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    body:
      - field: name
        type: string
      - field: kubernetesClusterAddress
        type: string
      - field: kubernetesClusterNamespace
        type: string
      - field: argoAppDeploymentName
        type: string
      - field: partOfNetwork
        type: boolean
    headers:
      - field: cookie
        type: string

validate_request_param:
  switch:
    - condition: ${incoming.body.name == null || incoming.body.kubernetesClusterAddress == null || incoming.body.kubernetesClusterNamespace == null || incoming.body.argoAppDeploymentName == null || incoming.body.partOfNetwork == null || incoming.headers == null || incoming.headers.cookie == null}
      next: return_bad_request
  next: assign_parameters

assign_parameters:
  assign:
    name: ${incoming.body.name}
    kubernetes_cluster_address: ${incoming.body.kubernetesClusterAddress}
    kubernetes_cluster_namespace: ${incoming.body.kubernetesClusterNamespace}
    argo_app_deployment_name: ${incoming.body.argoAppDeploymentName}
    part_of_network: ${incoming.body.partOfNetwork}
  next: call_create_user_log_template

call_create_user_log_template:
  template: "[#CENTOPS_PROJECT_LAYER]/log-user-request"
  requestType: templates
  body:
    method: "POST"
    path: "admin/clients"
  headers:
    cookie: ${incoming.headers.cookie}
  result: log_result
  next: send_request

send_request:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/create-client"
    body:
      name: ${name}
      kubernetes_cluster_address: ${kubernetes_cluster_address}
      kubernetes_cluster_namespace: ${kubernetes_cluster_namespace}
      argo_app_deployment_name: ${argo_app_deployment_name}
      part_of_network: ${part_of_network}
  result: create_result
  next: return_created

return_created:
  status: 201
  return: "Client created successfully"
  next: end

return_bad_request:
  status: 400
  return: "name, kubernetesClusterAddress, kubernetesClusterNamespace, argoAppDeploymentName, partOfNetwork and cookie are required"
  next: end
