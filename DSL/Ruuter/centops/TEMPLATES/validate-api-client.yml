declaration:
  call: declare
  version: 0.1
  description: "Validates API client credentials against api_clients table"
  method: post
  accepts: json
  returns: json
  namespace: centops
  allowlist:
    headers:
      - field: authorization
        type: string
        description: "Base64 encoded API key:secret"

validate_credentials:
  call: http.post
  args:
    url: "[#CENTOPS_RESQL]/validate-api-client"
    body:
      authorization: ${incoming.headers.authorization}
  result: db_result
  next: check_validation_result
  
check_validation_result:
  switch:
    - condition: ${db_result.response.body[0].isValid === "true"}
      next: return_authorized
  next: return_unauthorized

return_authorized:
  return: true
  next: end

return_unauthorized:
  status: 200
  return: false
  next: end
